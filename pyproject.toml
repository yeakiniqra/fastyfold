[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastyfold"
version = "0.2.0"
description = "A modern admin panel for FastAPI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "yeakiniqra" }]
keywords = ["fastapi", "admin", "sqlalchemy", "dashboard", "htmx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["uvicorn>=0.29", "aiosqlite>=0.20", "pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6",
       "pytailwindcss>=0.2", "pytest-playwright>=0.5"]

[project.urls]
Repository = "https://github.com/yeakiniqra/fastyfold"
Changelog = "https://github.com/yeakiniqra/fastyfold/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/fastyfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]          # test secrets and asserts
"examples/**" = ["S"]

[tool.coverage.run]
source = ["fastyfold"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
