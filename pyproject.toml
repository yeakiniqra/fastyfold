[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastyfold"
version = "0.1.0"
description = "A modern admin panel for FastAPI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "yeakiniqra" }]
keywords = ["fastapi", "admin", "sqlalchemy", "dashboard", "htmx"]
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["uvicorn>=0.29", "aiosqlite>=0.20", "pytest>=8", "httpx>=0.27", "pytailwindcss>=0.2", "pytest-playwright>=0.5"]

[project.urls]
Repository = "https://github.com/yeakiniqra/fastyfold"

[tool.hatch.build.targets.wheel]
packages = ["src/fastyfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
