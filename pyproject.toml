[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "fastyfold"
version = "0.2.1"
description = "A modern admin panel for FastAPI: table, board and split views, ⌘K search, roles, an audit log and a typed JSON API"
dynamic = ["readme"]
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "yeakiniqra" }]
keywords = ["fastapi", "admin", "sqlalchemy", "dashboard", "htmx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "sqlalchemy[asyncio]>=2.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["uvicorn>=0.29", "aiosqlite>=0.20", "pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.6",
       "pytailwindcss>=0.2", "pytest-playwright>=0.5"]

[project.urls]
Repository = "https://github.com/yeakiniqra/fastyfold"
Changelog = "https://github.com/yeakiniqra/fastyfold/blob/main/CHANGELOG.md"

# PyPI page: the README, links made absolute, plus this release's changelog section.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
text = "\n---\n\n**Release notes**\n\n"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "CHANGELOG.md"
pattern = "(## \\d+\\.\\d+\\.\\d+.*?)\n## \\d"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((docs/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/yeakiniqra/fastyfold/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(((?:[A-Z]+\.md)|LICENSE)\)'
replacement = '](https://github.com/yeakiniqra/fastyfold/blob/main/\1)'

[tool.hatch.build.targets.sdist]
exclude = ["docs/", ".github/"]     # screenshots stay on GitHub; the PyPI page links to them

[tool.hatch.build.targets.wheel]
packages = ["src/fastyfold"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]          # test secrets and asserts
"examples/**" = ["S"]

[tool.coverage.run]
source = ["fastyfold"]
branch = true
concurrency = ["thread", "greenlet"]   # TestClient runs the app in a thread; async SQLAlchemy runs code in greenlets

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
