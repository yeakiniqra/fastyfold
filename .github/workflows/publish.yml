name: Publish

# Push a tag like v0.2.1 (matching pyproject's version) to test, build and create the GitHub Release, whose
# notes are that version's section of CHANGELOG.md. PyPI publishing runs too once the repository variable
# PUBLISH_TO_PYPI is "true" and PyPI trusted publishing is set up. Run it by hand to (re)publish an existing tag.
# Each job builds for itself instead of passing artifacts, so no artifact storage is needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: pytest --ignore=tests/test_browser.py

  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tag matches the package version
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$TAG" || { echo "::error::Tag $TAG does not match version $version in pyproject.toml"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Release notes from CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = os.environ["VERSION"]
          m = re.search(rf"^## {re.escape(version)}\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"::error::CHANGELOG.md has no '## {version}' section")
          open("release-notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          PY
      - run: pip install build twine && python -m build && twine check dist/*
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --title "fastyfold $VERSION" --notes-file release-notes.md
            gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* -R "$GITHUB_REPOSITORY" --title "fastyfold $VERSION" --notes-file release-notes.md --verify-tag
          fi

  pypi:
    needs: test
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fastyfold
    permissions:
      id-token: write          # PyPI trusted publishing: no API token stored in the repo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build twine && python -m build && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
